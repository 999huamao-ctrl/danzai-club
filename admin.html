<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站长工作台 - 星语的蛋仔乐园</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 50%, #FFEAA7 100%);
            padding-bottom: 50px;
        }
        .admin-header {
            background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(108, 92, 231, 0.3);
        }
        .admin-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.2);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        .stat-label {
            color: var(--light-text);
            font-size: 1rem;
        }
        .admin-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.2);
        }
        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
            color: white;
        }
        .btn-success {
            background: #00B894;
            color: white;
        }
        .btn-danger {
            background: #FF7675;
            color: white;
        }
        .btn-warning {
            background: #FDCB6E;
            color: #2C3A47;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .nav-bar {
            text-align: center;
            margin-top: 30px;
        }
        .nav-bar a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 1rem;
        }
        .hidden {
            display: none !important;
        }
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #E0E0E0;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: #F0F0F0;
            border: none;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .announcement-item, .player-item {
            background: #F8F9FA;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-color);
        }
        .announcement-item h3, .player-item h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .announcement-item p, .player-item p {
            color: var(--text-color);
            line-height: 1.8;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        .badge-pending {
            background: #FDCB6E;
            color: #2C3A47;
        }
        .badge-approved {
            background: #00B894;
        }
    </style>
</head>
<body>
    <!-- 登录验证 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>🔐 站长验证</h2>
            <p style="color: var(--light-text); margin-bottom: 20px;">请输入站长密码</p>
            <input type="password" id="adminPassword" placeholder="输入密码">
            <button class="btn btn-primary" onclick="checkPassword()" style="width: 100%;">🚀 进入工作台</button>
            <p style="margin-top: 15px; font-size: 0.85rem; color: var(--light-text);">
                <a href="index.html" style="color: var(--primary-color);">← 返回首页</a>
            </p>
        </div>
    </div>

    <!-- 工作台内容 -->
    <div id="adminContent" class="hidden">
        <div class="admin-header">
            <h1>⭐ 站长工作台 ⭐</h1>
            <p>星语的蛋仔乐园 - 管理后台</p>
        </div>

        <div class="container">
            <!-- 数据统计 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalPlayers">0</div>
                    <div class="stat-label">🐣 总玩家数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalAnnouncements">0</div>
                    <div class="stat-label">📢 公告总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingReviews">0</div>
                    <div class="stat-label">⏳ 待审核</div>
                </div>
            </div>

            <!-- 选项卡导航 -->
            <div class="admin-section">
                <div class="tab-nav">
                    <button class="tab-btn active" onclick="switchTab('players')">📋 玩家管理</button>
                    <button class="tab-btn" onclick="switchTab('announcements')">📢 公告管理</button>
                    <button class="tab-btn" onclick="switchTab('publish')">✍️ 发布公告</button>
                </div>

                <!-- 玩家管理 -->
                <div id="playersTab" class="tab-content active">
                    <h2 class="section-title">📋 玩家管理</h2>
                    <div id="playerList"></div>
                </div>

                <!-- 公告管理 -->
                <div id="announcementsTab" class="tab-content">
                    <h2 class="section-title">📢 公告管理</h2>
                    <p style="color: var(--light-text); margin-bottom: 20px;">审核玩家提交的公告申请</p>
                    <div id="announcementList"></div>
                </div>

                <!-- 发布公告 -->
                <div id="publishTab" class="tab-content">
                    <h2 class="section-title">✍️ 发布公告</h2>
                    <div class="form-group">
                        <label>📝 公告标题</label>
                        <input type="text" id="announceTitle" placeholder="输入公告标题">
                    </div>
                    <div class="form-group">
                        <label>📄 公告内容</label>
                        <textarea id="announceContent" placeholder="输入公告内容..."></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="publishAnnouncement()" style="width: 100%;">📢 发布公告</button>
                </div>
            </div>

            <div class="nav-bar">
                <a href="index.html">🏠 返回首页</a>
                <a href="players.html">🎮 玩家展示</a>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'xingyu2026';
        
        function checkPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                localStorage.setItem('adminLoggedIn', 'true');
                loadAllData();
            } else {
                alert('❌ 密码错误！');
            }
        }
        
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            loadAllData();
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
        
        function loadAllData() {
            loadPlayers();
            loadAnnouncements();
            updateStats();
        }
        
        function loadPlayers() {
            let players = [];
            try {
                players = JSON.parse(localStorage.getItem('danzai_players') || '[]');
            } catch (e) {}
            
            const playerList = document.getElementById('playerList');
            if (players.length === 0) {
                playerList.innerHTML = '<p style="text-align: center; color: var(--light-text); padding: 40px;">🐣 还没有玩家提交信息</p>';
                return;
            }
            
            playerList.innerHTML = players.reverse().map((p, i) => `
                <div class="player-item">
                    <h3>${p.nickname} <span class="badge">${p.gender}</span></h3>
                    <p>🎂 ${p.age} | 🏫 ${p.school} | 🎨 ${p.hobby || '未填写'}</p>
                    <p>🎮 ${p.gameMode} | 🏆 ${p.rank} | 💰 ${p.payment}</p>
                    <p>🐣 ${p.eggId} | 💬 ${p.wechat}</p>
                    <p style="font-size: 0.85rem; color: var(--light-text);">📅 ${p.joinTime}</p>
                    <div class="action-buttons">
                        <button class="btn btn-danger" onclick="deletePlayer(${players.length - 1 - i})">🗑️ 删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        function loadAnnouncements() {
            let announcements = [];
            try {
                announcements = JSON.parse(localStorage.getItem('danzai_announcements') || '[]');
            } catch (e) {}
            
            const announcementList = document.getElementById('announcementList');
            const pending = announcements.filter(a => a.status === 'pending');
            const published = announcements.filter(a => a.status === 'published');
            
            let html = '';
            
            if (pending.length > 0) {
                html += '<h3 style="margin: 20px 0 15px; color: var(--primary-color);">⏳ 待审核公告</h3>';
                html += pending.map((a, i) => {
                    const realIndex = announcements.indexOf(a);
                    return `
                        <div class="announcement-item" style="border-left-color: #FDCB6E;">
                            <h3>${a.title} <span class="badge badge-pending">待审核</span></h3>
                            <p>${a.content}</p>
                            <p style="font-size: 0.85rem; color: var(--light-text);">📅 提交时间：${a.submitTime}</p>
                            ${a.submitter ? `<p style="font-size: 0.85rem; color: var(--light-text);">👤 提交人：${a.submitter}</p>` : ''}
                            <div class="action-buttons">
                                <button class="btn btn-success" onclick="approveAnnouncement(${realIndex})">✅ 通过</button>
                                <button class="btn btn-danger" onclick="rejectAnnouncement(${realIndex})">❌ 拒绝</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            if (published.length > 0) {
                html += '<h3 style="margin: 20px 0 15px; color: var(--primary-color);">✅ 已发布公告</h3>';
                html += published.map(a => `
                    <div class="announcement-item" style="border-left-color: #00B894;">
                        <h3>${a.title} <span class="badge badge-approved">已发布</span></h3>
                        <p>${a.content}</p>
                        <p style="font-size: 0.85rem; color: var(--light-text);">📅 发布时间：${a.publishTime || a.submitTime}</p>
                    </div>
                `).join('');
            }
            
            if (announcements.length === 0) {
                html = '<p style="text-align: center; color: var(--light-text); padding: 40px;">📢 还没有公告</p>';
            }
            
            announcementList.innerHTML = html;
        }
        
        function publishAnnouncement() {
            const title = document.getElementById('announceTitle').value.trim();
            const content = document.getElementById('announceContent').value.trim();
            
            if (!title || !content) {
                alert('❌ 请填写标题和内容');
                return;
            }
            
            let announcements = [];
            try {
                announcements = JSON.parse(localStorage.getItem('danzai_announcements') || '[]');
            } catch (e) {}
            
            announcements.push({
                id: Date.now(),
                title: title,
                content: content,
                status: 'published',
                submitTime: new Date().toLocaleString('zh-CN'),
                publishTime: new Date().toLocaleString('zh-CN'),
                submitter: '站长'
            });
            
            localStorage.setItem('danzai_announcements', JSON.stringify(announcements));
            
            document.getElementById('announceTitle').value = '';
            document.getElementById('announceContent').value = '';
            
            alert('✅ 公告已发布！');
            loadAnnouncements();
            updateStats();
        }
        
        function approveAnnouncement(index) {
            let announcements = [];
            try {
                announcements = JSON.parse(localStorage.getItem('danzai_announcements') || '[]');
            } catch (e) {}
            
            if (announcements[index]) {
                announcements[index].status = 'published';
                announcements[index].publishTime = new Date().toLocaleString('zh-CN');
                localStorage.setItem('danzai_announcements', JSON.stringify(announcements));
                alert('✅ 公告已通过审核并发布！');
                loadAnnouncements();
                updateStats();
            }
        }
        
        function rejectAnnouncement(index) {
            if (confirm('确定要拒绝这个公告吗？')) {
                let announcements = [];
                try {
                    announcements = JSON.parse(localStorage.getItem('danzai_announcements') || '[]');
                } catch (e) {}
                
                announcements.splice(index, 1);
                localStorage.setItem('danzai_announcements', JSON.stringify(announcements));
                alert('❌ 公告已拒绝');
                loadAnnouncements();
                updateStats();
            }
        }
        
        function deletePlayer(index) {
            if (confirm('确定要删除这个玩家吗？')) {
                let players = [];
                try {
                    players = JSON.parse(localStorage.getItem('danzai_players') || '[]');
                } catch (e) {}
                
                players.splice(index, 1);
                localStorage.setItem('danzai_players', JSON.stringify(players));
                alert('✅ 已删除');
                loadPlayers();
                updateStats();
            }
        }
        
        function updateStats() {
            let players = [];
            let announcements = [];
            try {
                players = JSON.parse(localStorage.getItem('danzai_players') || '[]');
                announcements = JSON.parse(localStorage.getItem('danzai_announcements') || '[]');
            } catch (e) {}
            
            document.getElementById('totalPlayers').textContent = players.length;
            document.getElementById('totalAnnouncements').textContent = announcements.filter(a => a.status === 'published').length;
            document.getElementById('pendingReviews').textContent = announcements.filter(a => a.status === 'pending').length;
        }
        
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
