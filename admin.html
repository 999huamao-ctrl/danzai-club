<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站长工作台 - 星语的蛋仔乐园</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 50%, #FFEAA7 100%);
            padding-bottom: 50px;
        }
        .admin-header {
            background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(108, 92, 231, 0.3);
        }
        .admin-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .admin-header p {
            opacity: 0.95;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.2);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .stat-label {
            color: var(--light-text);
            font-size: 1rem;
        }
        .admin-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.2);
        }
        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-list {
            display: grid;
            gap: 15px;
        }
        .player-item {
            background: #F8F9FA;
            border-radius: 12px;
            padding: 20px;
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 20px;
            align-items: center;
            transition: all 0.3s;
        }
        .player-item:hover {
            background: #F0EDF5;
            transform: translateX(5px);
        }
        .player-item-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            overflow: hidden;
        }
        .player-item-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-item-info h3 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        .player-item-info p {
            font-size: 0.9rem;
            color: var(--light-text);
            margin: 3px 0;
        }
        .player-item-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-delete {
            background: #FF7675;
            color: white;
        }
        .btn-delete:hover {
            background: #D63031;
        }
        .btn-export {
            background: var(--primary-color);
            color: white;
        }
        .btn-export:hover {
            background: var(--secondary-color);
        }
        .btn-back {
            background: #DFE6E9;
            color: var(--text-color);
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover {
            background: #B2BEC3;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--light-text);
        }
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .nav-bar {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
        }
        .nav-bar a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 1rem;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .login-box h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- 登录验证 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>🔐 站长验证</h2>
            <p style="color: var(--light-text); margin-bottom: 20px;">请输入站长密码</p>
            <input type="password" id="adminPassword" placeholder="输入密码">
            <button onclick="checkPassword()">🚀 进入工作台</button>
            <p style="margin-top: 15px; font-size: 0.85rem; color: var(--light-text);">
                <a href="index.html" style="color: var(--primary-color);">← 返回首页</a>
            </p>
        </div>
    </div>

    <!-- 工作台内容 -->
    <div id="adminContent" class="hidden">
        <div class="admin-header">
            <h1>⭐ 站长工作台 ⭐</h1>
            <p>星语的蛋仔乐园 - 管理后台</p>
        </div>

        <div class="container">
            <!-- 数据统计 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalPlayers">0</div>
                    <div class="stat-label">🐣 总玩家数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="todayPlayers">0</div>
                    <div class="stat-label">📅 今日新增</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="malePlayers">0</div>
                    <div class="stat-label">👦 男玩家</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="femalePlayers">0</div>
                    <div class="stat-label">👧 女玩家</div>
                </div>
            </div>

            <!-- 玩家管理 -->
            <div class="admin-section">
                <div class="action-bar">
                    <h2 class="section-title">📋 玩家管理</h2>
                    <button class="btn btn-export" onclick="exportData()">📥 导出数据</button>
                </div>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 搜索玩家昵称、蛋号、微信号..." oninput="filterPlayers()">
                </div>

                <div id="playerList" class="player-list">
                    <!-- 玩家列表将在这里显示 -->
                </div>
            </div>

            <!-- 操作说明 -->
            <div class="admin-section">
                <h2 class="section-title">📖 使用说明</h2>
                <div style="line-height: 2; color: var(--text-color);">
                    <p>✅ <strong>查看玩家：</strong> 所有玩家提交的信息都会显示在这里</p>
                    <p>✅ <strong>搜索玩家：</strong> 输入昵称、蛋号或微信号快速查找</p>
                    <p>✅ <strong>删除玩家：</strong> 点击删除按钮可以移除玩家卡片</p>
                    <p>✅ <strong>导出数据：</strong> 点击导出按钮可以下载所有玩家数据（Excel 格式）</p>
                    <p>⚠️ <strong>注意：</strong> 删除操作不可恢复，请谨慎操作！</p>
                </div>
            </div>

            <div class="nav-bar">
                <a href="index.html">🏠 返回首页</a>
                <a href="players.html">🎮 玩家展示</a>
                <a href="join.html">📝 填写表单</a>
            </div>
        </div>
    </div>

    <script>
        // 密码验证（简单验证）
        const ADMIN_PASSWORD = 'xingyu2026'; // 站长密码
        
        function checkPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                localStorage.setItem('adminLoggedIn', 'true');
                loadPlayers();
            } else {
                alert('❌ 密码错误！');
            }
        }
        
        // 检查是否已登录
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            loadPlayers();
        }
        
        // 加载玩家数据
        function loadPlayers() {
            let players = [];
            try {
                const saved = localStorage.getItem('danzai_players');
                if (saved) {
                    players = JSON.parse(saved);
                }
            } catch (e) {
                console.log('读取失败');
            }
            
            // 更新统计
            document.getElementById('totalPlayers').textContent = players.length;
            
            const today = new Date().toLocaleDateString('zh-CN');
            const todayCount = players.filter(p => p.joinTime.includes(today)).length;
            document.getElementById('todayPlayers').textContent = todayCount;
            
            const maleCount = players.filter(p => p.gender === '男').length;
            document.getElementById('malePlayers').textContent = maleCount;
            
            const femaleCount = players.filter(p => p.gender === '女').length;
            document.getElementById('femalePlayers').textContent = femaleCount;
            
            // 渲染玩家列表
            renderPlayerList(players);
        }
        
        // 渲染玩家列表
        function renderPlayerList(players) {
            const playerList = document.getElementById('playerList');
            
            if (players.length === 0) {
                playerList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🐣</div>
                        <h3>还没有玩家提交信息</h3>
                        <p>等玩家填写表单后，会显示在这里</p>
                    </div>
                `;
                return;
            }
            
            // 按时间倒序排列
            players.reverse().forEach((player, index) => {
                const realIndex = players.length - 1 - index;
                const item = document.createElement('div');
                item.className = 'player-item';
                
                const avatarDisplay = player.avatar.startsWith('data:') 
                    ? `<img src="${player.avatar}" alt="头像">`
                    : `<span>${player.avatar}</span>`;
                
                item.innerHTML = `
                    <div class="player-item-avatar">${avatarDisplay}</div>
                    <div class="player-item-info">
                        <h3>${player.nickname} <span class="badge">${player.gender}</span></h3>
                        <p>🎂 ${player.age} | 🏫 ${player.school}</p>
                        <p>🎮 ${player.gameMode} | 🏆 ${player.rank}</p>
                        <p>🐣 蛋号：${player.eggId} | 💬 微信：${player.wechat}</p>
                        ${player.note ? `<p>📝 备注：${player.note}</p>` : ''}
                        <p style="font-size: 0.8rem; color: var(--light-text);">提交时间：${player.joinTime}</p>
                    </div>
                    <div class="player-item-actions">
                        <button class="btn btn-delete" onclick="deletePlayer(${realIndex})">🗑️ 删除</button>
                    </div>
                `;
                
                playerList.appendChild(item);
            });
        }
        
        // 删除玩家
        function deletePlayer(index) {
            if (confirm('确定要删除这个玩家吗？\n\n此操作不可恢复！')) {
                let players = [];
                try {
                    const saved = localStorage.getItem('danzai_players');
                    if (saved) {
                        players = JSON.parse(saved);
                    }
                } catch (e) {}
                
                players.splice(index, 1);
                localStorage.setItem('danzai_players', JSON.stringify(players));
                loadPlayers();
                alert('✅ 已删除');
            }
        }
        
        // 搜索玩家
        function filterPlayers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            
            let players = [];
            try {
                const saved = localStorage.getItem('danzai_players');
                if (saved) {
                    players = JSON.parse(saved);
                }
            } catch (e) {}
            
            if (keyword) {
                players = players.filter(p => 
                    p.nickname.toLowerCase().includes(keyword) ||
                    p.eggId.toLowerCase().includes(keyword) ||
                    p.wechat.toLowerCase().includes(keyword)
                );
            }
            
            renderPlayerList(players);
        }
        
        // 导出数据
        function exportData() {
            let players = [];
            try {
                const saved = localStorage.getItem('danzai_players');
                if (saved) {
                    players = JSON.parse(saved);
                }
            } catch (e) {}
            
            if (players.length === 0) {
                alert('❌ 没有数据可导出');
                return;
            }
            
            // 生成 CSV 内容
            let csv = '昵称，性别，年龄，学校，爱好，游戏模式，段位，氪金，上线时长，蛋号，微信，备注，提交时间\n';
            players.forEach(p => {
                csv += `"${p.nickname}","${p.gender}","${p.age}","${p.school}","${p.hobby}","${p.gameMode}","${p.rank}","${p.payment}","${p.playTime}","${p.eggId}","${p.wechat}","${p.note || ''}","${p.joinTime}"\n`;
            });
            
            // 下载文件
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `蛋仔玩家数据_${new Date().toLocaleDateString('zh-CN')}.csv`;
            link.click();
        }
        
        // 按回车登录
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
