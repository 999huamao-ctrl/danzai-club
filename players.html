<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家展示 - 快来寻找你的蛋仔搭子</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 50%, #FFEAA7 100%);
            padding-bottom: 50px;
        }
        .page-header {
            background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.3);
        }
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .page-header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .player-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(162, 155, 254, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .player-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(162, 155, 254, 0.3);
        }
        .player-card::before {
            content: '🐣';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2rem;
            opacity: 0.2;
        }
        .player-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #FFEAA7, #FAB1A0);
            overflow: hidden;
        }
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-name {
            font-size: 1.5rem;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .player-info {
            font-size: 0.95rem;
            line-height: 2;
            background: #F8F9FA;
            padding: 15px;
            border-radius: 12px;
        }
        .player-info p {
            margin: 5px 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .player-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin: 3px;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(162, 155, 254, 0.2);
        }
        .empty-state-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        .empty-state h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        .empty-state p {
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.3);
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(162, 155, 254, 0.4);
        }
        .nav-links {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
        }
        .nav-links a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .player-count {
            text-align: center;
            margin-bottom: 20px;
            color: var(--light-text);
            font-size: 1rem;
        }
        .join-time {
            font-size: 0.8rem;
            color: var(--light-text);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>🎮 玩家展示</h1>
        <p>快来看看都有哪些蛋仔搭子！</p>
    </div>

    <div class="container">
        <p class="player-count" id="playerCount">加载中...</p>
        
        <div id="playersGrid" class="players-grid">
            <!-- 玩家卡片将在这里显示 -->
        </div>

        <div class="nav-links">
            <a href="index.html">🏠 返回首页</a>
            <a href="join.html">📝 填写信息</a>
        </div>
    </div>

    <script>
        // 加载玩家数据
        function loadPlayers() {
            const playersGrid = document.getElementById('playersGrid');
            const playerCount = document.getElementById('playerCount');
            
            let players = [];
            try {
                const saved = localStorage.getItem('danzai_players');
                if (saved) {
                    players = JSON.parse(saved);
                }
            } catch (e) {
                console.log('读取失败');
            }
            
            // 更新计数
            playerCount.textContent = `🐣 已有 ${players.length} 位蛋仔玩家加入寻找搭子！`;
            
            if (players.length === 0) {
                // 空状态
                playersGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🐣</div>
                        <h2>还没有玩家卡片</h2>
                        <p>快来成为第一个展示蛋仔信息的玩家吧！</p>
                        <a href="join.html" class="btn">🎮 立即填写</a>
                    </div>
                `;
                return;
            }
            
            // 渲染玩家卡片（最新的在前）
            players.reverse().forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                
                const avatarDisplay = player.avatar.startsWith('data:') 
                    ? `<img src="${player.avatar}" alt="头像">`
                    : `<span>${player.avatar}</span>`;
                
                card.innerHTML = `
                    <div class="player-avatar">${avatarDisplay}</div>
                    <h3 class="player-name">${player.nickname}</h3>
                    <div class="player-info">
                        <p><span>👤</span> <strong>性别:</strong> ${player.gender}</p>
                        <p><span>🎂</span> <strong>年龄:</strong> ${player.age}</p>
                        <p><span>🏫</span> <strong>学校:</strong> ${player.school}</p>
                        <p><span>🎨</span> <strong>爱好:</strong> ${player.hobby}</p>
                        <p><span>🎮</span> <strong>游戏模式:</strong> ${player.gameMode}</p>
                        <p><span>🏆</span> <strong>段位:</strong> ${player.rank}</p>
                        <p><span>💰</span> <strong>氪金:</strong> ${player.payment}</p>
                        <p><span>⏰</span> <strong>在线:</strong> ${player.playTime}</p>
                        <p><span>🐣</span> <strong>蛋号:</strong> ${player.eggId}</p>
                        <p><span>💬</span> <strong>微信:</strong> ${player.wechat}</p>
                    </div>
                    <div style="margin-top: 15px; text-align: center;">
                        <span class="player-tag">🎮 蛋仔派对</span>
                        <span class="player-tag">✨ 寻找搭子</span>
                    </div>
                    <p class="join-time">加入时间：${player.joinTime}</p>
                `;
                
                playersGrid.appendChild(card);
            });
        }
        
        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', loadPlayers);
    </script>
</body>
</html>
