<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填写蛋仔信息 - 快来寻找你的蛋仔搭子</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 50%, #FFEAA7 100%);
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(162, 155, 254, 0.3);
        }
        .form-title {
            text-align: center;
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .form-subtitle {
            text-align: center;
            color: var(--light-text);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: bold;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .form-group input.required,
        .form-group select.required {
            border-left: 4px solid var(--primary-color);
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.4);
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(162, 155, 254, 0.5);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .tips {
            background: #FFF3CD;
            border-left: 4px solid #FFC312;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #856404;
        }
        .avatar-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 100%);
            border: 3px dashed #A29BFE;
            border-radius: 15px;
            font-size: 1.1rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .avatar-btn:hover {
            background: linear-gradient(135deg, #E8E4F0 0%, #E5E0EB 100%);
            border-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        .avatar-preview {
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .avatar-preview img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            object-fit: cover;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.3);
        }
        .avatar-preview p {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">🐣 填写你的蛋仔信息</h1>
        <p class="form-subtitle">简单填写，快速找到搭子！</p>
        
        <div class="tips">
            💡 <strong>温馨提示：</strong> 不要填写真实姓名、学校地址等隐私信息哦！
        </div>

        <form id="playerForm">
            <div class="form-group">
                <label>🎮 游戏昵称 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="nickname" class="required" placeholder="例如：快乐蛋仔" required>
            </div>

            <div class="form-group">
                <label>🖼️ 上传头像 <span style="color: #FF6B9D">*</span></label>
                
                <!-- 隐藏的文件输入 -->
                <input type="file" name="avatar" id="avatarInput" class="required" accept="image/*" required style="display: none;">
                <input type="file" name="avatarCamera" id="avatarCameraInput" class="required" accept="image/*" capture="environment" required style="display: none;">
                
                <!-- 两个按钮 -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <button type="button" class="avatar-btn" onclick="document.getElementById('avatarCameraInput').click()" style="background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%); color: white; border: none;">
                        📷 直接拍照
                    </button>
                    <button type="button" class="avatar-btn" onclick="document.getElementById('avatarInput').click()">
                        🖼️ 从相册选择
                    </button>
                </div>
                
                <p style="font-size: 0.85rem; color: var(--light-text); text-align: center;">✨ 可以选择拍照或从相册选择照片</p>
                
                <div class="avatar-preview" id="avatarPreview">
                    <img id="previewImg" src="" alt="头像预览">
                    <p>✅ 头像已选择</p>
                </div>
            </div>

            <div class="form-group">
                <label>👤 性别 <span style="color: #FF6B9D">*</span></label>
                <select name="gender" class="required" required>
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="form-group">
                <label>🎂 年龄 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="age" class="required" placeholder="例如：10 岁" required>
            </div>

            <div class="form-group">
                <label>🏫 职业/就学阶段 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="school" class="required" placeholder="例如：小学五年级" required>
            </div>

            <div class="form-group">
                <label>🎨 爱好</label>
                <input type="text" name="hobby" placeholder="例如：画画、跳舞、运动">
            </div>

            <div class="form-group">
                <label>🎮 爱玩的游戏模式 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="gameMode" class="required" placeholder="例如：竞速赛、生存赛、团队赛" required>
            </div>

            <div class="form-group">
                <label>🏆 游戏段位 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="rank" class="required" placeholder="例如：鹅蛋、鸡蛋、鸵鸟蛋" required>
            </div>

            <div class="form-group">
                <label>💰 氪金等级 <span style="color: #FF6B9D">*</span></label>
                <select name="payment" class="required" required>
                    <option value="">请选择</option>
                    <option value="低氪">低氪</option>
                    <option value="中氪">中氪</option>
                    <option value="高氪">高氪</option>
                </select>
            </div>

            <div class="form-group">
                <label>⏰ 上线时长 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="playTime" class="required" placeholder="例如：每天 2 小时、周末 4 小时" required>
            </div>

            <div class="form-group">
                <label>🐣 蛋号（游戏账号） <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="eggId" class="required" placeholder="你的蛋仔派对账号" required>
            </div>

            <div class="form-group">
                <label>💬 微信号 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="wechat" class="required" placeholder="用于联系和组队" required>
            </div>

            <div class="form-group">
                <label>📝 备注（选填）</label>
                <textarea name="note" rows="3" placeholder="想说的其他话，比如：希望找什么类型的搭子、游戏时间等（可不填）" style="resize: vertical;"></textarea>
            </div>

            <button type="submit" class="submit-btn">🎮 提交信息，寻找搭子！</button>
        </form>

        <div class="back-link">
            <a href="index.html">← 返回首页</a>
            <span style="margin: 0 10px;">|</span>
            <a href="players.html">🎮 查看玩家卡片</a>
        </div>
    </div>

    <script>
        // 头像预览功能
        const avatarInput = document.getElementById('avatarInput');
        const avatarCameraInput = document.getElementById('avatarCameraInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const previewImg = document.getElementById('previewImg');
        let avatarDataUrl = '';
        
        // 处理相册选择
        avatarInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarDataUrl = e.target.result;
                    previewImg.src = avatarDataUrl;
                    avatarPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 处理相机拍照
        avatarCameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarDataUrl = e.target.result;
                    previewImg.src = avatarDataUrl;
                    avatarPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 表单提交
        document.getElementById('playerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // 创建玩家对象
            const player = {
                id: Date.now(),
                nickname: data.nickname,
                avatar: avatarDataUrl || '🐣',
                gender: data.gender,
                age: data.age,
                school: data.school,
                hobby: data.hobby || '未填写',
                gameMode: data.gameMode,
                rank: data.rank,
                payment: data.payment,
                playTime: data.playTime,
                eggId: data.eggId,
                wechat: data.wechat,
                note: data.note || '',
                joinTime: new Date().toLocaleString('zh-CN')
            };
            
            // 保存到 localStorage
            let players = [];
            try {
                const saved = localStorage.getItem('danzai_players');
                if (saved) {
                    players = JSON.parse(saved);
                }
            } catch (e) {
                console.log('读取失败，创建新数组');
            }
            
            players.push(player);
            localStorage.setItem('danzai_players', JSON.stringify(players));
            
            // 显示成功消息
            alert('✅ 信息提交成功！\n\n你的蛋仔信息已保存！\n\n现在可以去玩家展示区查看你的卡片，也能看到其他玩家的卡片哦~ 🎉');
            
            // 跳转到玩家展示区
            window.location.href = 'players.html';
        });
    </script>
</body>
</html>
