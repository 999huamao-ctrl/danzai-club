<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填写蛋仔信息 - 快来寻找你的蛋仔搭子</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 50%, #FFEAA7 100%);
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(162, 155, 254, 0.3);
        }
        .form-title {
            text-align: center;
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .form-subtitle {
            text-align: center;
            color: var(--light-text);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: bold;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .form-group input.required,
        .form-group select.required {
            border-left: 4px solid var(--primary-color);
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.4);
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(162, 155, 254, 0.5);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .tips {
            background: #FFF3CD;
            border-left: 4px solid #FFC312;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">🐣 填写你的蛋仔信息</h1>
        <p class="form-subtitle">简单填写，快速找到搭子！</p>
        
        <div class="tips">
            💡 <strong>温馨提示：</strong> 不要填写真实姓名、学校地址等隐私信息哦！
        </div>

        <form id="playerForm">
            <div class="form-group">
                <label>🎮 游戏昵称 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="nickname" class="required" placeholder="例如：快乐蛋仔" required>
            </div>

            <div class="form-group">
                <label>🖼️ 上传头像 <span style="color: #FF6B9D">*</span></label>
                <input type="file" name="avatar" id="avatarInput" class="required" accept="image/*" required style="padding: 10px; border: 2px dashed #A29BFE; background: #F8F9FA;">
                <p style="font-size: 0.85rem; color: var(--light-text); margin-top: 8px;">📸 可以上传自己的照片或喜欢的图片（支持 JPG、PNG 格式）</p>
                <div id="avatarPreview" style="margin-top: 15px; text-align: center; display: none;">
                    <img id="previewImg" src="" alt="头像预览" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary-color); object-fit: cover;">
                    <p style="font-size: 0.85rem; color: var(--primary-color); margin-top: 8px;">✅ 头像已选择</p>
                </div>
            </div>

            <div class="form-group">
                <label>👤 性别 <span style="color: #FF6B9D">*</span></label>
                <select name="gender" class="required" required>
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="form-group">
                <label>🎂 年龄 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="age" class="required" placeholder="例如：10 岁" required>
            </div>

            <div class="form-group">
                <label>🏫 职业/就学阶段 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="school" class="required" placeholder="例如：小学五年级" required>
            </div>

            <div class="form-group">
                <label>🎨 爱好</label>
                <input type="text" name="hobby" placeholder="例如：画画、跳舞、运动">
            </div>

            <div class="form-group">
                <label>🎮 爱玩的游戏模式 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="gameMode" class="required" placeholder="例如：竞速赛、生存赛、团队赛" required>
            </div>

            <div class="form-group">
                <label>🏆 游戏段位 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="rank" class="required" placeholder="例如：鹅蛋、鸡蛋、鸵鸟蛋" required>
            </div>

            <div class="form-group">
                <label>💰 氪金等级 <span style="color: #FF6B9D">*</span></label>
                <select name="payment" class="required" required>
                    <option value="">请选择</option>
                    <option value="低氪">低氪</option>
                    <option value="中氪">中氪</option>
                    <option value="高氪">高氪</option>
                </select>
            </div>

            <div class="form-group">
                <label>⏰ 上线时长 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="playTime" class="required" placeholder="例如：每天 2 小时、周末 4 小时" required>
            </div>

            <div class="form-group">
                <label>🐣 蛋号（游戏账号） <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="eggId" class="required" placeholder="你的蛋仔派对账号" required>
            </div>

            <div class="form-group">
                <label>💬 微信号 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="wechat" class="required" placeholder="用于联系和组队" required>
            </div>

            <button type="submit" class="submit-btn">🎮 提交信息，寻找搭子！</button>
        </form>

        <div class="back-link">
            <a href="index.html">← 返回首页</a>
        </div>
    </div>

    <script>
        // 头像预览功能
        const avatarInput = document.getElementById('avatarInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const previewImg = document.getElementById('previewImg');
        
        avatarInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    avatarPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 表单提交
        document.getElementById('playerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // 处理头像
            const avatarFile = document.getElementById('avatarInput').files[0];
            let avatarData = '🐣'; // 默认头像
            
            // 显示成功消息
            alert('✅ 信息提交成功！\n\n你的蛋仔信息已经展示在玩家区啦！\n\n快去玩家展示区看看你的卡片吧~ 🎉');
            
            // 跳转到玩家展示区
            window.location.href = 'index.html#players';
        });
    </script>
</body>
</html>
