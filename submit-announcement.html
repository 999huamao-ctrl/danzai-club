<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交公告 - 快来寻找你的蛋仔搭子</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 50%, #FFEAA7 100%);
        }
        .form-container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(162, 155, 254, 0.3);
        }
        .form-title {
            text-align: center;
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 15px;
        }
        .form-subtitle {
            text-align: center;
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: bold;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(162, 155, 254, 0.4);
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(162, 155, 254, 0.5);
        }
        .back-link {
            text-align: center;
            margin-top: 25px;
        }
        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .tips {
            background: #FFF3CD;
            border-left: 4px solid #FFC312;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #856404;
            line-height: 1.8;
        }
        .tips strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .info-box {
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        .info-box p {
            color: var(--text-color);
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">📢 提交公告申请</h1>
        <p class="form-subtitle">分享你的想法，经过审核后发布</p>
        
        <div class="info-box">
            <p>🎮 想要组织活动？分享游戏心得？<br>
            在这里提交你的公告，站长审核通过后会发布在首页哦！</p>
        </div>
        
        <div class="tips">
            <strong>📋 发布须知：</strong>
            ✅ 自动审核，立即发布<br>
            ✅ 内容必须与蛋仔派对游戏相关<br>
            ✅ 语言文明，遵守中国法律法规<br>
            ✅ 活动公告请写明时间、内容、参与方式<br>
            ❌ 禁止广告、引流、不当内容<br>
            ⚠️ 违规内容将被站长删除
        </div>

        <form id="announcementForm">
            <div class="form-group">
                <label>📝 公告标题 <span style="color: #FF6B9D">*</span></label>
                <input type="text" name="title" required placeholder="例如：周末欢乐赛活动公告">
            </div>

            <div class="form-group">
                <label>📄 公告内容 <span style="color: #FF6B9D">*</span></label>
                <textarea name="content" required placeholder="详细描述你的公告内容...

如果是活动公告，请写明：
- 活动时间
- 活动内容
- 参与方式
- 奖励设置（如有）"></textarea>
            </div>

            <div class="form-group">
                <label>👤 你的昵称（选填）</label>
                <input type="text" name="submitter" placeholder="审核后显示为公告发布者">
            </div>

            <div class="form-group">
                <label>💬 联系方式（选填）</label>
                <input type="text" name="contact" placeholder="微信号或 QQ 号，方便站长联系你">
            </div>

            <button type="submit" class="submit-btn">📢 提交审核</button>
        </form>

        <div class="back-link">
            <a href="index.html">← 返回首页</a>
            <span style="margin: 0 15px;">|</span>
            <a href="join.html">📝 填写玩家信息</a>
        </div>
    </div>

    <script>
        // 敏感词库（违反中国法律和蛋仔游戏规定的内容）
        const sensitiveWords = [
            // 政治敏感
            '天安门', '法轮功', '台独', '藏独', '港独',
            // 暴力恐怖
            '杀人', '爆炸', '恐怖', '自杀', '自残',
            // 色情低俗
            '色情', '裸体', '淫秽', '成人', '性爱',
            // 赌博
            '赌博', '赌球', '百家乐', '老虎机',
            // 诈骗
            '刷单', '兼职', '转账', '汇款', '银行卡', '密码',
            // 广告引流
            '加微信', '加 QQ', '公众号', '小程序', '点击链接',
            // 其他违规
            '毒品', '吸毒', '贩毒', '枪支', '弹药'
        ];
        
        // 检查内容是否违规
        function checkContent(text) {
            const lowerText = text.toLowerCase();
            
            // 检查敏感词
            for (const word of sensitiveWords) {
                if (lowerText.includes(word.toLowerCase())) {
                    return {
                        valid: false,
                        reason: `内容包含不当词汇："${word}"`
                    };
                }
            }
            
            // 检查长度
            if (text.length < 20) {
                return {
                    valid: false,
                    reason: '内容太短，请至少写 20 个字'
                };
            }
            
            // 检查是否包含联系方式（防止引流）
            const phoneRegex = /1[3-9]\d{9}/;
            const qqRegex = /\d{5,12}/;
            if (phoneRegex.test(text)) {
                return {
                    valid: false,
                    reason: '不能包含手机号码'
                };
            }
            
            return { valid: true };
        }
        
        document.getElementById('announcementForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const title = formData.get('title').trim();
            const content = formData.get('content').trim();
            const submitter = formData.get('submitter').trim() || '匿名玩家';
            const contact = formData.get('contact').trim();
            
            if (!title || !content) {
                alert('❌ 请填写标题和内容');
                return;
            }
            
            // 自动审核
            const titleCheck = checkContent(title);
            if (!titleCheck.valid) {
                alert('❌ 标题未通过审核：\n' + titleCheck.reason + '\n\n请修改后重新提交！');
                return;
            }
            
            const contentCheck = checkContent(content);
            if (!contentCheck.valid) {
                alert('❌ 内容未通过审核：\n' + contentCheck.reason + '\n\n请修改后重新提交！');
                return;
            }
            
            // 保存到已发布列表（自动通过）
            let announcements = [];
            try {
                announcements = JSON.parse(localStorage.getItem('danzai_announcements') || '[]');
            } catch (e) {}
            
            announcements.push({
                id: Date.now(),
                title: title,
                content: content,
                status: 'published',
                submitTime: new Date().toLocaleString('zh-CN'),
                publishTime: new Date().toLocaleString('zh-CN'),
                submitter: submitter,
                contact: contact || ''
            });
            
            localStorage.setItem('danzai_announcements', JSON.stringify(announcements));
            
            // 显示成功消息
            alert('✅ 发布成功！\n\n你的公告已通过审核并发布！\n所有玩家都可以在首页看到你的公告~ 🐣🎉');
            
            // 清空表单
            this.reset();
            
            // 跳转到首页
            window.location.href = 'index.html#activities';
        });
    </script>
</body>
</html>
