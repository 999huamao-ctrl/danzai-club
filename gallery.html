<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋仔壁纸 - 星语的蛋仔乐园</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #F0EDF5 0%, #DFE6E9 50%, #FFEAA7 100%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(162, 155, 254, 0.2);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card-title {
            font-size: 1.2rem;
            color: #A29BFE;
            margin-bottom: 10px;
        }
        .card p {
            color: #718093;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #6C5CE7;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <h1>🐣 蛋仔派对精美图片 🥚</h1>
    <div class="gallery">
        <!-- 蛋仔角色 -->
        <div class="card">
            <img src="https://webassets.epicgames.com/offer/5a24b7d2e2724fb9a9e02e2e8c5e7b3e/EGS_EggyParty_YoozooGames_S2_1200x1600_1200x1600" alt="蛋仔角色">
            <div class="card-content">
                <h3 class="card-title">🐣 可爱蛋仔</h3>
                <p>圆滚滚的蛋仔角色，萌翻全场！</p>
            </div>
        </div>
        
        <!-- 游戏场景 -->
        <div class="card">
            <img src="https://cdn1.epicgames.com/offer/5a24b7d2e2724fb9a9e02e2e8c5e7b3e/EGS_EggyParty_YoozooGames_S1_2560x1440_2560x1440" alt="游戏场景">
            <div class="card-content">
                <h3 class="card-title">🎮 游戏关卡</h3>
                <p>丰富多样的闯关场景，每一关都是新冒险！</p>
            </div>
        </div>
        
        <!-- 蛋仔皮肤 -->
        <div class="card">
            <img src="https://img.epicgames.com/offer/5a24b7d2e2724fb9a9e02e2e8c5e7b3e/EGS_EggyParty_YoozooGames_S2_1200x1600_1200x1600" alt="蛋仔皮肤">
            <div class="card-content">
                <h3 class="card-title">👕 精美皮肤</h3>
                <p>各种可爱皮肤，打造专属蛋仔！</p>
            </div>
        </div>
        
        <!-- 团队模式 -->
        <div class="card">
            <img src="https://cdn2.epicgames.com/offer/5a24b7d2e2724fb9a9e02e2e8c5e7b3e/EGS_EggyParty_YoozooGames_S3_1200x1600_1200x1600" alt="团队合作">
            <div class="card-content">
                <h3 class="card-title">👥 团队闯关</h3>
                <p>和朋友一起组队，快乐翻倍！</p>
            </div>
        </div>
    </div>
</body>
</html>
